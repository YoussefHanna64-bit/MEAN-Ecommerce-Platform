<main
  class="flex-grow-1 d-flex align-items-center justify-content-center"
  style="padding: var(--xxl) var(--margin)"
>
  <div style="width: 100%; max-width: 480px">
    <div
      class="bg-white auth-card-shadow border rounded-3"
      style="padding: var(--xl); border-color: var(--outline-variant) !important"
    >
      <div
        class="d-flex border-bottom mb-4"
        style="gap: var(--md); border-color: var(--outline-variant) !important"
      >
        <button
          class="pb-2 h3-custom border-bottom border-primary border-2 bg-transparent border-0"
          style="color: var(--primary) !important"
          (click)="switchToLogin()"
        >
          Login
        </button>
        <button
          class="pb-2 h3-custom text-secondary bg-transparent border-0 opacity-50"
          (click)="switchToSignup()"
        >
          Create Account
        </button>
      </div>

      <div class="mb-4">
        <h1 class="h2-custom mb-2">Welcome back</h1>
        <p class="text-secondary mb-0">Please enter your credentials to access your account.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="mb-3">
          <label class="label-sm-custom text-secondary mb-1 d-block" for="email">
            Email Address
          </label>
          <input
            formControlName="email"
            class="form-input-custom"
            id="email"
            name="email"
            placeholder="example@company.com"
            type="email"
          />
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="label-sm-custom text-secondary mb-0" for="password">Password</label>
          </div>
          <div class="position-relative">
            <input
              formControlName="password"
              class="form-input-custom"
              id="password"
              name="password"
              placeholder="••••••••"
              [type]="showPassword ? 'text' : 'password'"
            />
            <button
              class="position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent pe-3 text-secondary"
              type="button"
              (click)="togglePassword()"
            >
              <span class="material-symbols-outlined" style="font-size: 20px">
                {{ showPassword ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
        </div>

        <button
          class="btn-primary-custom w-100 mt-4 d-flex align-items-center justify-content-center"
          style="gap: var(--sm)"
          type="submit"
          [disabled]="loginForm.invalid || isLoading"
        >
          @if (isLoading) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <span>Signing in...</span>
          } @else {
            Sign In
            <span class="material-symbols-outlined">arrow_forward</span>
          }
        </button>
      </form>
    </div>

    <div
      class="mt-4 p-3 rounded-3"
      [class.d-none]="!loginError"
      style="background-color: var(--error-container); color: var(--on-error-container)"
    >
      <div class="d-flex gap-2">
        <span class="material-symbols-outlined text-danger">error</span>
        <p class="caption-custom mb-0">
          Invalid email or password. Please check your credentials and try again.
        </p>
      </div>
    </div>
  </div>
</main>
