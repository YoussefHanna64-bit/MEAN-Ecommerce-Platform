<div class="products-section container py-5">
  <div class="mb-5 text-center">
    <h2 class="h2-custom fw-bold mb-1">Featured Products</h2>
    <p class="text-muted small">Handpicked quality for your daily needs.</p>
  </div>

  <!-- Categories Section -->
  <app-categories
    [categories]="categories()"
    [selectedCategory]="selectedCategory()"
    (categorySelected)="selectCategory($event)"
  >
  </app-categories>

  <div class="row g-4">
    @for (product of products(); track product._id) {
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="product-card">
          <div class="product-img-wrapper">
            <img
              [src]="product.images[0] || 'assets/placeholder.jpg'"
              [alt]="product.name"
              class="product-img"
            />
            @if (product.stock > 0 && product.stock < 5) {
              <span class="stock-badge">LOW STOCK</span>
            }
          </div>

          <div class="card-content p-3">
            <p class="category-text mb-1">
              {{ product.category }}
            </p>
            <h3 class="product-title mb-2">{{ product.name }}</h3>

            <div class="d-flex justify-content-between align-items-center mt-auto">
              <span class="product-price">${{ product.price }}</span>
              <button class="add-btn" (click)="addToCart(product._id)" aria-label="Add to cart">
                <span class="material-symbols-outlined">shopping_cart</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    } @empty {
      <div class="col-12 text-center py-5">
        <p class="text-muted">No products found.</p>
      </div>
    }
  </div>
</div>
