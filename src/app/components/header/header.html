<header class="header-fixed fixed-top bg-white">
    <div class="custom-container d-flex justify-content-evenly align-items-center h-100 px-4">
        <div class="d-flex align-items-center gap-5">
            <span class="h3-custom mb-0">E-SHOP</span>
            <div class="search-bar d-none d-md-flex align-items-center">
                <span class="material-symbols-outlined text-secondary fs-5">search</span>
                <input class="ms-2" type="text" placeholder="Search products...">
            </div>
        </div>
        <div class="d-flex align-items-center gap-4">
            <div class="dropdown" [class.show]="showUserMenu">
                <button
                    type="button"
                    class="btn p-0 text-secondary dropdown-toggle d-flex align-items-center"
                    (click)="toggleUserMenu()"
                    aria-expanded="showUserMenu"
                >
                    <span class="material-symbols-outlined">person</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" [class.show]="showUserMenu">
                    <li>
                        <button class="dropdown-item" type="button" (click)="goToProfile()">Profile</button>
                    </li>
                    <li><hr class="dropdown-divider" /></li>
                    <li>
                        <button class="dropdown-item" type="button" (click)="goToOrders()">Orders</button>
                    </li>
                    <li><hr class="dropdown-divider" /></li>
                    <li>
                        <button class="dropdown-item text-danger" type="button" (click)="logout()">Logout</button>
                    </li>
                </ul>
            </div>
            <button class="btn p-0 text-secondary position-relative" (click)="goToCart()">
                <span class="material-symbols-outlined">shopping_cart</span>
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary">{{ cartService.cartItemsCount() }}</span>
            </button>
        </div>
    </div>
</header>
