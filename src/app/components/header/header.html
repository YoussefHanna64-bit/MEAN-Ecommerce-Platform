<header class="header-fixed fixed-top bg-white">
  <div class="custom-container d-flex align-items-center h-100 px-lg-5 px-3">
    <div class="header-left">
      <span class="brand-logo mb-0" routerLink="/main/home">Carty</span>
    </div>

    <div class="header-center">
      <div class="search-container d-none d-md-flex align-items-center">
        <span class="material-symbols-outlined search-icon">search</span>
        <input
          class="search-input"
          type="text"
          placeholder="Search products..."
          (input)="onSearchChange($event)"
        />
      </div>
    </div>

    <div class="header-right d-flex align-items-center mx-4 gap-2">
      <div class="dropdown" [class.show]="showUserMenu">
        <button type="button" class="action-btn" (click)="toggleUserMenu()" aria-label="User menu">
          <span class="material-symbols-outlined">person</span>
        </button>

        <ul
          class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2"
          [class.show]="showUserMenu"
        >
          <li><button class="dropdown-item py-2" (click)="goToProfile()">Profile</button></li>
          <li><button class="dropdown-item py-2" (click)="goToOrders()">Orders</button></li>
          <li><hr class="dropdown-divider opacity-50" /></li>
          <li>
            <button class="dropdown-item py-2 text-danger fw-medium" (click)="logout()">
              Logout
            </button>
          </li>
        </ul>
      </div>

      <button class="action-btn position-relative" (click)="goToCart()" aria-label="View cart">
        <span class="material-symbols-outlined">shopping_cart</span>
        @if (cartService.cartItemsCount() > 0) {
          <span class="cart-count-badge">{{ cartService.cartItemsCount() }}</span>
        }
      </button>
    </div>
  </div>
</header>
