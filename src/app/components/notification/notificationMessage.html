@if (notification.message(); as msg) {
  @if (msg.type !== 'None') {
    <div
      class="toast show align-items-center text-white bg-success border-0 position-fixed top-0 end-0 m-3"
      [ngClass]="{
        'bg-success text-white': msg.type === 'Success',
        'bg-danger text-white': msg.type === 'Delete',
        'bg-warning text-dark': msg.type === 'Warning',
        'bg-primary text-white': msg.type === 'Update',
      }"
    >
      <div class="d-flex">
        <div class="toast-body">{{ msg.message }}</div>
      </div>
    </div>
  }
}
