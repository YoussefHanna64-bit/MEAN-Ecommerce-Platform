<main
  class="flex-grow-1 d-flex align-items-center justify-content-center"
  style="padding: var(--xxl) var(--margin)"
>
  <div style="width: 100%; max-width: 480px">
    <div
      class="bg-white auth-card-shadow border rounded-3"
      style="padding: var(--xl); border-color: var(--outline-variant) !important"
    >
      <div
        class="d-flex border-bottom mb-4"
        style="gap: var(--md); border-color: var(--outline-variant) !important"
      >
        <button
          class="pb-2 h3-custom text-primary border-bottom border-primary border-2 bg-transparent border-0"
          style="color: var(--primary) !important"
          (click)="switchToLogin()"
        >
          Login
        </button>
        <button
          class="pb-2 h3-custom text-secondary bg-transparent border-0 opacity-50"
          (click)="switchToSignup()"
        >
          Create Account
        </button>
      </div>

      <div class="mb-4">
        <h1 class="h2-custom mb-2">Welcome back</h1>
        <p class="text-secondary mb-0">Please enter your credentials to access your account.</p>
      </div>

      <form>
        <div class="mb-3">
          <label class="label-sm-custom text-secondary mb-1 d-block" for="email"
            >Email Address</label
          >
          <input
            class="form-input-custom"
            id="email"
            name="email"
            placeholder="name@company.com"
            type="email"
          />
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="label-sm-custom text-secondary mb-0" for="password">Password</label>
            <a class="caption-custom text-primary text-decoration-none" href="#"
              >Forgot password?</a
            >
          </div>
          <div class="position-relative">
            <input
              class="form-input-custom"
              id="password"
              name="password"
              placeholder="••••••••"
              type="password"
            />
            <button
              class="position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent pe-3 text-secondary"
              type="button"
            >
              <span class="material-symbols-outlined" style="font-size: 20px">visibility</span>
            </button>
          </div>
        </div>

        <button
          class="btn-primary-custom w-100 mt-4 d-flex align-items-center justify-content-center"
          style="gap: var(--sm)"
          type="submit"
          (click)="loginValidation()"
        >
          Sign In
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>

        <div class="position-relative my-4 text-center">
          <hr
            class="position-absolute top-50 start-0 w-100 m-0"
            style="border-color: var(--outline-variant)"
          />
          <span class="position-relative bg-white px-3 caption-custom text-secondary"
            >Or continue with</span
          >
        </div>

        <div class="row g-3">
          <div class="col-6">
            <button class="btn-social w-100 label-sm-custom" type="button">
              <img
                alt="Google"
                style="width: 16px; height: 16px"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8afzQarLL4rPrZRVx_fooqVq0IYaqQTYbpTcv-W72yzNeWWMfVRK4YnoUTj5ZKVyGrFOcMUM_lKqiASd5KBeWegu20KOMYXOYjRe0u9eEHFhX4i1TMYsV7_5WBiLKkfZsp6Z5jixQRigSEyVbyOFTmvPxc8PjEvFGMdfkrcaOJF8c2jQ49qpvud4GAL17HfHlsKypu3VXYitP5psaTi0vMIMd-aHxbbJOTPHhb95j05hYIsXh4hmQRvqIPHM1PLpkfoIcASaI2yw"
              />
              Google
            </button>
          </div>
          <div class="col-6">
            <button class="btn-social w-100 label-sm-custom" type="button">
              <span class="material-symbols-outlined">ios</span>
              Apple
            </button>
          </div>
        </div>
      </form>
    </div>

    <div
      class="mt-4 p-3 rounded-3 d-none"
      style="background-color: var(--error-container); color: var(--on-error-container)"
    >
      <div class="d-flex gap-2">
        <span class="material-symbols-outlined text-danger">error</span>
        <p class="caption-custom mb-0">
          Invalid email or password. Please check your credentials and try again.
        </p>
      </div>
    </div>
  </div>
</main>
