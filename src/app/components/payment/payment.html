@if (showSuccess) {
  <div class="success-overlay">
    <div class="success-card">
      <div class="success-icon">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="#22a06b" opacity="0.12" />
          <circle cx="20" cy="20" r="14" fill="#22a06b" opacity="0.2" />
          <path
            d="M13 20l5 5 9-9"
            stroke="#22a06b"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <h2 class="success-title">Payment successful!</h2>
      <p class="success-sub">Your order has been placed. Redirecting you home...</p>
      <div class="success-bar">
        <div class="success-bar-fill"></div>
      </div>
    </div>
  </div>
}

<div class="pf-wrap">
  <div class="pf-card">
    <h2 class="pf-title">Complete your payment</h2>

    <form [formGroup]="paymentForm">
      <div class="field-row">
        <div>
          <label class="field-label">Full name</label>
          <input class="field-input" type="text" formControlName="name" placeholder="example" />
        </div>
        <div>
          <label class="field-label">Email</label>
          <input
            class="field-input"
            type="email"
            formControlName="email"
            placeholder="account@email.com"
          />
        </div>
      </div>

      <div class="field-full">
        <label class="field-label">Amount</label>
        <div class="amount-wrap">
          <span class="amount-prefix">$</span>
          <input class="field-input amount-input" type="number" formControlName="amount" readonly />
        </div>
      </div>

      <div ngxStripeCardGroup [elementsOptions]="elementsOptions">
        <div class="card-section">
          <ngx-stripe-card-number [options]="cardOptions"></ngx-stripe-card-number>
          <div class="card-row">
            <ngx-stripe-card-expiry [options]="cardOptions"></ngx-stripe-card-expiry>
            <ngx-stripe-card-cvc [options]="cardOptions"></ngx-stripe-card-cvc>
          </div>
        </div>
      </div>

      <button class="pay-btn" (click)="pay()" [disabled]="!paymentForm.valid || isLoading">
        @if (isLoading) {
          <span class="spinner"></span>
        } @else {
          Pay now
        }
      </button>
    </form>
  </div>
</div>
