<div class="chat-container fixed-bottom d-flex flex-column align-items-end" style="z-index: 1060">
  <div class="chat-window">
    <div class="chat-header d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <div class="position-relative">
          <div class="bot-avatar d-flex align-items-center justify-content-center">
            <span class="material-symbols-outlined fs-5">smart_toy</span>
          </div>
          <span class="online-indicator position-absolute bottom-0 end-0"></span>
        </div>
        <div>
          <div class="header-title mb-1">E-SHOP Assistant</div>
          <div class="header-subtitle d-flex align-items-center gap-1">
            <span class="pulse-dot"></span> Online and ready
          </div>
        </div>
      </div>
      <button class="close-btn" (click)="closeChatpot()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="chat-scroll" #chatScroll>
      @for (msg of messages; track $index) {
        @if (msg.sender === 'bot') {
          <div class="mb-3 w-100">
            <div class="msg-bubble bot-bubble">
              {{ msg.text }}
            </div>
            <span class="msg-time text-start ms-2"
              >Assistant • {{ msg.time | date: 'shortTime' }}</span
            >
          </div>
        } @else {
          <div class="mb-3 w-100 d-flex flex-column align-items-end">
            <div class="msg-bubble user-bubble">
              {{ msg.text }}
            </div>
            <span class="msg-time text-end me-2">You • {{ msg.time | date: 'shortTime' }}</span>
          </div>
        }
      }

      @if (isTyping) {
        <div class="mb-3">
          <div
            class="msg-bubble bot-bubble d-flex align-items-center gap-1"
            style="padding: 14px 16px"
          >
            <div class="typing-dot" style="animation-delay: 0s"></div>
            <div class="typing-dot" style="animation-delay: 0.2s"></div>
            <div class="typing-dot" style="animation-delay: 0.4s"></div>
          </div>
        </div>
      }
    </div>

    <div class="chat-input-area">
      <div class="d-flex gap-2 mb-3 overflow-auto pb-1 suggestion-container">
        <span class="suggestion-badge text-nowrap" (click)="sendMessage('Return policy?')"
          >Return policy?</span
        >
        <span class="suggestion-badge text-nowrap" (click)="sendMessage('Size guide')"
          >Size guide</span
        >
      </div>

      <div class="input-wrapper d-flex align-items-center">
        <input
          type="text"
          class="chat-input flex-grow-1"
          placeholder="Type your message..."
          [(ngModel)]="userInput"
          (keyup.enter)="sendMessage()"
        />
        <button class="send-btn" (click)="sendMessage()" [disabled]="!userInput.trim()">
          <span class="material-symbols-outlined" style="font-size: 20px">send</span>
        </button>
      </div>
    </div>
  </div>
</div>
